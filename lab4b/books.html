
<!DOCTYPE html>
<html>
<head>
    <title>Books Information</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f4f4;
        }

        h1 {
            color: #333;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
        }

        .book {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #e8f0fe;
            border-radius: 5px;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <h1>Books Information</h1>

    <div class="container" id="bookData">
        <p>Loading book information...</p>
    </div>

    <script>
        async function loadBooks() {
            const bookData = document.getElementById("bookData");

            try {
                const response = await fetch("books.json");

                if (!response.ok) {
                    throw new Error("Unable to retrieve books data.");
                }

                const data = await response.json();

                const books = data.books;

                bookData.textContent = "";

                // (a) Display title of first book
                const firstTitle = document.createElement("p");
                firstTitle.textContent =
                    "First Book Title: " + books[0].title;

                bookData.appendChild(firstTitle);

                // (b) Display author of second book
                const secondAuthor = document.createElement("p");
                secondAuthor.textContent =
                    "Second Book Author: " + books[1].author;

                bookData.appendChild(secondAuthor);

                // (c) Display genres of both books
                books.forEach(function(book) {
                    const bookDiv = document.createElement("div");
                    bookDiv.className = "book";

                    const title = document.createElement("h3");
                    title.textContent = book.title;

                    const genres = document.createElement("p");
                    genres.textContent =
                        "Genres: " + book.genres.join(", ");

                    bookDiv.appendChild(title);
                    bookDiv.appendChild(genres);

                    bookData.appendChild(bookDiv);
                });

            } catch (error) {
                bookData.textContent =
                    "Error: Unable to load book information. " +
                    error.message;

                bookData.className = "error";
            }
        }

        loadBooks();
    </script>

</body>
</html>
